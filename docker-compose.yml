services:
  postgres:
    image: postgres:17
    container_name: meetup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: meetup_dev_password
      POSTGRES_DB: meetup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meetup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: